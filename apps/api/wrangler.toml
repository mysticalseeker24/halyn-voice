#:schema node_modules/wrangler/config-schema.json
name = "halyn-api"
main = "src/index.ts"
compatibility_date = "2026-10-19"
# No nodejs_compat: WebCrypto and fetch only (CLAUDE.md §6). Turning it on needs an ADR.

[observability]
enabled = true

# One Hub per tenant: WebSockets, confirmation alarms, ordered ledger appends, idempotency.
[[durable_objects.bindings]]
name = "HUB"
class_name = "HubDO"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["HubDO"]

# Aero Core (apps/aero-core), the mock bank: Worker to Worker, never over the public internet. The core client uses
# this binding; without it, the AERO_CORE_URL var (local dev against `wrangler dev` of aero-core).
[[services]]
binding = "AERO_CORE"
service = "halyn-aero-core"

# Compiled policy packs (key pack:<tenant>:<region>, docs/RUNBOOK.md) and agent ids. Namespace id: docs/RUNBOOK.md first-time setup, step 4.
[[kv_namespaces]]
binding = "CONFIG"
id = "0944d7d7f5c9451e813fc1e7cbe2e87e"

# Clone clips, ledger exports, test reports: in KV CONFIG (`file:<tenant>:<kind>:<id>`) for now, AWS S3 if we reach the
# final round (ADR-023). R2 needs a payment method on the account (refused), so this binding stays off.
# [[r2_buckets]]
# binding = "FILES"
# bucket_name = "halyn-files"

# Non-secret settings. Secrets (HALYN_TOOL_SECRET, SESSION_SECRET, TIDB_DATABASE_URL, signing keys, peppers, API keys)
# come from `wrangler secret put` in production and apps/api/.dev.vars locally — names in .env.example.
[vars]
DEFAULT_TENANT_ID = "ten_aero"
BOLNA_SOURCE_IPS = "13.203.39.153,13.126.9.249,13.202.133.53"
WEB_ORIGIN = "https://halyn-voice.vercel.app,http://localhost:3000"
RP_ID = "halyn-voice.vercel.app"
