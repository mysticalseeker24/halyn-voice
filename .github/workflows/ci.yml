name: ci
on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6 # version from package.json "packageManager"
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test:unit # coverage thresholds are enforced in every package's test:unit
      - run: pnpm test:int
        env:
          # The gated TiDB suite (ADR-013) runs when this secret exists, and skips with a warning otherwise.
          TIDB_TEST_DATABASE_URL: ${{ secrets.TIDB_TEST_DATABASE_URL }}
      - run: pnpm test:scenarios
      - run: pnpm build
      - name: Secret scan
        run: |
          if git grep -nE -- '-----BEGIN [A-Z ]*PRIVATE KEY-----|sk[-_][A-Za-z0-9_-]{20,}|bn-[0-9a-f]{32}|cfat_[A-Za-z0-9]{20,}' -- ':!*.md' ':!scripts/hooks/*'; then
            echo "Secret-like string found"; exit 1; fi
  e2e:
    runs-on: ubuntu-latest
    needs: verify
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @halyn/web exec playwright install --with-deps chromium
      - run: pnpm test:e2e
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: apps/web/playwright-report/
          retention-days: 7
