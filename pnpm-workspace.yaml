packages:
  - apps/*
  - packages/*

# One version per tool across the repo. Workspace packages use "catalog:".
# typescript stays on 6.0.x: typescript-eslint 8.x supports >=4.8.4 <6.1.0.
catalog:
  '@cloudflare/vitest-plugin': ^1.4.7
  '@tidbcloud/serverless': ^0.3.0
  '@eslint/js': ^10.0.1
  '@playwright/test': ^1.64.1
  '@tailwindcss/postcss': ^4.3.3
  '@testing-library/react': ^16.3.3
  '@types/node': ^24.19.2
  '@types/react': ^19.3.0
  '@types/react-dom': ^19.3.0
  '@vitejs/plugin-react': ^6.1.2
  '@vitest/coverage-istanbul': ^5.0.5
  '@vitest/coverage-v8': ^5.0.5
  drizzle-kit: ^0.31.11
  drizzle-orm: ^0.45.4
  eslint: ^10.13.0
  eslint-config-next: ^16.4.3
  eslint-config-prettier: ^10.1.8
  fast-check: ^4.10.2
  globals: ^17.13.0
  hono: ^4.13.13
  jsdom: ^30.1.3
  next: ^16.4.3
  prettier: ^3.9.10
  react: ^19.3.1
  react-dom: ^19.3.1
  tailwindcss: ^4.3.3
  tsup: ^9.0.0
  tsx: ^4.23.15
  turbo: ^2.11.10
  typescript: ~6.0.3
  typescript-eslint: ^8.72.0
  # Vitest 5 no longer depends on vite directly; every package that runs vitest lists it.
  vite: ^8.3.5
  vitest: ^5.0.5
  wrangler: ^4.152.0
  yaml: ^2.8.1
  zod: ^4.6.0

# pnpm 11+ blocks dependency build scripts unless they are listed here.
allowBuilds:
  esbuild: true
  workerd: true
  sharp: true
  '@tailwindcss/oxide': true
  unrs-resolver: true
